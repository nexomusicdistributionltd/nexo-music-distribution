name: Final webhook predeploy verification

on:
  push:
    branches:
      - fix/final-webhook-hardening-20260918
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://nexomusicdistribution.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_SERVICE_ROLE_KEY: placeholder-service-role-key
      DISTRIBUTION_API_BASE_URL: https://api.example.com/v1
      DISTRIBUTION_AUTHORIZE_URL: https://example.com/oauth/authorize
      DISTRIBUTION_TOKEN_URL: https://example.com/oauth/token
      DISTRIBUTION_CLIENT_ID: placeholder-client
      DISTRIBUTION_CLIENT_SECRET: placeholder-client-secret
      DISTRIBUTION_OAUTH_STATE_SECRET: placeholder-oauth-state-secret
      DISTRIBUTION_TOKEN_ENCRYPTION_KEY: placeholder-token-encryption-key-32chars
      DISTRIBUTION_REDIRECT_URI: https://nexomusicdistribution.com/api/admin/distribution/oauth/callback
      DISTRIBUTION_WEBHOOK_SECRET: placeholder-webhook-secret
      PROVIDER_WEBHOOK_SECRET: placeholder-provider-webhook-secret
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: Nexo Music Distribution LTD <contact@nexomusicdistro.space>
      SMTP_HOST: smtp.zoho.com
      SMTP_PORT: "465"
      SMTP_USER: contact@nexomusicdistro.space
      SMTP_PASSWORD: placeholder-password
      PADDLE_ENVIRONMENT: production
      PADDLE_API_KEY: placeholder-paddle-key
      PADDLE_WEBHOOK_SECRET: placeholder-paddle-webhook-secret
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: live_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install DDEX XSD validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          echo "TEST_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Production build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-webhook-verification-logs
          path: |
            test.log
            build.log
      - name: Enforce verification
        run: |
          test "${TEST_EXIT_CODE}" = "0"
          test "${BUILD_EXIT_CODE}" = "0"
