name: Temporary DSP analytics verification

on:
  push:
    branches:
      - fix/realtime-dsp-analytics-20260918

concurrency:
  group: temp-dsp-analytics-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - name: Test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          echo "TEST_EXIT_CODE=${code}" >> "$GITHUB_ENV"
          exit 0
      - name: TypeScript
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee typescript.log
          code=${PIPESTATUS[0]}
          echo "TSC_EXIT_CODE=${code}" >> "$GITHUB_ENV"
          exit 0
      - name: Production build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=${code}" >> "$GITHUB_ENV"
          exit 0
      - name: Enforce verification
        run: |
          test "$TEST_EXIT_CODE" = "0"
          test "$TSC_EXIT_CODE" = "0"
          test "$BUILD_EXIT_CODE" = "0"
